name: secrets-demo
on:
  push:
    branches: [main]
jobs:
  show:
    runs-on: ubuntu-latest
    steps:
      - name: Use a variable and a secret
        run: |
          echo "Project is: $PROJECT"
          echo "Token is: $TOKEN"
          echo "Token length is: ${#TOKEN}"
        env:
          PROJECT: ${{ vars.GCP_PROJECT }}
          TOKEN: ${{ secrets.DEMO_TOKEN }}
